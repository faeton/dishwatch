# Copy to faeton/homebrew-tap:.github/workflows/ci.yml
#
# The tap has no CI at all today, so a malformed cask or a stale sha256 is
# discovered by whoever runs `brew install` first. Everything here is cheap and
# catches the failures that actually happen: a SHA that no longer matches the
# uploaded asset, a URL that 404s after a retagged release, and style/audit
# violations that make `brew audit` reject the tap.
name: tap

on:
  push:
  pull_request:
  # The cask points at a GitHub release asset that is edited by a separate
  # repo's release process. A weekly run catches a DMG replaced or removed
  # after the cask was merged, which no push to this repo would ever surface.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  # Homebrew now asks for explicit trust before running commands from a tap.
  # This workflow audits our own tap inside our own CI, where there is no third
  # party to trust and the prompt has nowhere to go.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  # `brew audit --online` resolves GitHub URLs, and unauthenticated runners get
  # 60 requests an hour shared across the whole IP — which a single audit run
  # exhausts. The runner's own token lifts it; without this the job fails on
  # rate limits rather than on anything wrong with the tap.
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: tap this checkout
        run: |
          # Audit the working copy, not whatever is already installed.
          brew tap-new faeton/tap --no-git 2>/dev/null || true
          dest="$(brew --repository faeton/tap)"
          rm -rf "$dest"
          mkdir -p "$(dirname "$dest")"
          cp -R "$GITHUB_WORKSPACE" "$dest"

      - run: brew style faeton/tap

      # --online fetches the URL and verifies the checksum, which is the whole
      # point: a cask whose sha256 does not match the published DMG installs
      # nowhere, and nothing else here would notice.
      - name: audit casks
        run: |
          shopt -s nullglob
          n=0
          for f in Casks/*.rb; do
            token="$(basename "$f" .rb)"
            n=$((n + 1))
            echo "== auditing $token"
            brew audit --cask --online --strict "faeton/tap/$token"
          done
          echo "audited $n cask(s)"
          test "$n" -gt 0 || { echo "ERROR: no casks matched Casks/*.rb" >&2; exit 1; }

      # Advisory, and deliberately not fatal: the goreleaser-generated formula
      # carries `version` alongside per-arch URLs, which --strict calls
      # redundant. That is a false positive we cannot fix without hand-editing
      # generated output — but it is NOT a reason to discard the whole audit,
      # which is what `|| true` used to do. The check that actually matters is
      # split out into its own fatal step below.
      - name: lint formulae (advisory)
        run: |
          shopt -s nullglob
          # Say what is being audited. A clean `brew audit` prints nothing at
          # all, which makes a passing step and a step whose glob matched
          # nothing look identical in the log — the same "silence reads as
          # success" trap as the `|| true` this replaced.
          n=0
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            n=$((n + 1))
            echo "== auditing $name"
            brew audit --formula --online --strict "faeton/tap/$name" \
              && echo "   clean" \
              || echo "::warning title=formula lint::brew audit --strict flagged $name (see log)"
          done
          echo "audited $n formula(e)"
          test "$n" -gt 0 || { echo "ERROR: no formulae matched Formula/*.rb" >&2; exit 1; }

      # The one thing a swallowed audit was hiding that can break every user at
      # once: a URL that 404s after a retagged release, or a sha256 that no
      # longer matches the published asset. Checked for EVERY url/sha256 pair,
      # not just the runner's own architecture — no install exercises the other
      # three, so nothing else here would ever notice.
      - name: published assets match their recorded hashes
        run: |
          # pipefail matters here: without it `curl | shasum | awk` reports
          # awk's status, so a 404 surfaces as "hash mismatch" against the
          # sha256 of an empty string rather than as a download failure.
          set -o pipefail
          shopt -s nullglob
          rc=0
          checked=0
          for f in Formula/*.rb Casks/*.rb; do
            echo "== ${f}"
            ver="$(awk '/^[[:space:]]*version[[:space:]]+"/ {match($0,/"[^"]+"/); print substr($0,RSTART+1,RLENGTH-2); exit}' "$f")"
            pairs="$(awk '
              /^[[:space:]]*url[[:space:]]+"/    { match($0,/"[^"]+"/); u=substr($0,RSTART+1,RLENGTH-2); if (s!="") { print u" "s; s=""; u="" } }
              /^[[:space:]]*sha256[[:space:]]+"/ { match($0,/"[^"]+"/); s=substr($0,RSTART+1,RLENGTH-2); if (u!="") { print u" "s; u=""; s="" } }
            ' "$f")"
            if [ -z "$pairs" ]; then
              echo "  ERROR: parsed no url/sha256 pairs — the parser or the file shape changed" >&2
              rc=1; continue
            fi
            while read -r url want; do
              url="${url//\#\{version\}/$ver}"
              if ! got="$(curl -fsSL --retry 2 --max-time 300 "$url" | shasum -a 256 | awk '{print $1}')"; then
                echo "  FAIL ${url##*/} — did not download" >&2; rc=1; continue
              fi
              if [ "$got" = "$want" ]; then
                echo "  ok   ${url##*/}"
                checked=$((checked + 1))
              else
                echo "  FAIL ${url##*/}" >&2
                echo "       recorded  $want" >&2
                echo "       published $got" >&2
                rc=1
              fi
            done <<< "$pairs"
          done
          echo "verified $checked published asset(s)"
          test "$checked" -gt 0 || { echo "ERROR: verified nothing — no formula or cask was read" >&2; exit 1; }
          exit $rc

  install:
    runs-on: macos-15
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: tap this checkout
        run: |
          dest="$(brew --repository faeton/tap)"
          rm -rf "$dest"; mkdir -p "$(dirname "$dest")"
          cp -R "$GITHUB_WORKSPACE" "$dest"

      # A cask install is where quarantine and notarization are actually
      # exercised. `spctl` afterwards is the check that matters — Homebrew will
      # happily install an app Gatekeeper then refuses to launch.
      - name: install the app cask and assess it
        run: |
          if [ ! -f Casks/dishwatch-app.rb ]; then echo "no cask yet, skipping"; exit 0; fi
          brew install --cask faeton/tap/dishwatch-app
          app="/Applications/DishWatch.app"
          test -d "$app" || { echo "cask installed no app at $app" >&2; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # Assert, do not print. A notarized DMG containing only the runner's
          # own slice passes install, stapler and spctl exactly like a universal
          # one — `echo` then reported the single architecture and returned 0,
          # so CI went green on a build that cannot start on half the Macs it
          # is offered to.
          for bin in DishWatch dishwatch-helper; do
            archs="$(lipo -archs "$app/Contents/MacOS/$bin")"
            echo "  $bin: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "  ERROR: $bin is '$archs', expected a universal arm64 + x86_64 binary" >&2; exit 1 ;;
            esac
          done
          brew uninstall --cask faeton/tap/dishwatch-app

      # The formula was only ever installed on Linux, so the Darwin bottles in
      # it — a different URL and a different sha from the Linux ones — went
      # straight to users unexercised. Same install the average Mac user runs.
      - name: install the CLI formula on macOS and run it
        run: |
          brew install faeton/tap/dishwatch
          dishwatch --version
          sl --version
          sl --help >/dev/null

  formula-linux:
    # The formula claims Linux support in its on_linux block and nothing has
    # ever installed it there.
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      # No staging: setup-homebrew already symlinks this checkout in as
      # faeton/tap, so the tap-qualified name resolves as-is. Copying over that
      # path is what broke the two previous attempts — first nesting the repo
      # inside itself, then leaving a real directory where the action's
      # post-job cleanup expected the symlink it had made. And a formula cannot
      # be installed from a bare path at all; Homebrew requires it to be in a
      # tap.
      - name: install the CLI on Linux and run it
        run: |
          brew install faeton/tap/dishwatch
          dishwatch --version
          sl --version
          sl --help >/dev/null
