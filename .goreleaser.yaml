version: 2

project_name: dishwatch

before:
  hooks:
    - go mod tidy

builds:
  - id: dishwatch
    main: .
    binary: dishwatch
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: dishwatch
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  # The DMG is not a goreleaser artifact, so it is absent from checksums.txt
  # unless named here — and the Homebrew cask needs the SHA of the exact file
  # that was uploaded. Without this the cask's sha256 has to be computed by
  # hand from a file nobody can verify was the published one.
  extra_files:
    - glob: app/.build/DishWatch-{{ .Version }}.dmg

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

# Deprecated since goreleaser v2.10, and kept deliberately.
#
# `goreleaser check` exits non-zero over this and will keep doing so. That is
# accepted, not overlooked — `make check` does not run it, so CI is unaffected,
# and a `release` still generates the formula in 2.17.1 (verified by dry run:
# the deprecation is a warning at the defaults stage, nothing more).
#
# The recommended migration is `brews` → `homebrew_casks`, and it cannot be
# taken yet, because **casks are macOS-only**: Homebrew answers a cask install
# on Linux with "Error: Installing casks is supported only on macOS"
# (https://github.com/orgs/Homebrew/discussions/3999). README.md advertises
# "The CLI — macOS and Linux, arm64 and x86_64 — brew install
# faeton/tap/dishwatch", and the generated formula does carry `on_linux` URLs,
# so renaming the key would quietly withdraw a documented platform.
#
# Goreleaser's own justification is the part that does not apply here: "This
# was the only way to do it for Linuxbrew at the time, but this is no longer
# true" (https://goreleaser.com/blog/goreleaser-v2.10/). It is still true for
# this project.
#
# Migrate when Linux brew support is deliberately dropped, not before — and
# when that day comes it needs a `tap_migrations.json` in the tap so existing
# formula installs move to the cask rather than silently going stale.
brews:
  - name: dishwatch
    repository:
      owner: faeton
      name: homebrew-tap
      branch: main
    directory: Formula
    homepage: https://github.com/faeton/dishwatch
    # Under 80 characters, or `brew style` rejects the generated formula —
    # which nothing checked until the tap grew CI. The previous wording was 100.
    description: Starlink dish status, dashboard and power-bank CLI over local gRPC
    license: MIT
    commit_author:
      name: goreleaser
      email: faeton@gmail.com
    install: |
      bin.install "dishwatch"
      bin.install_symlink "dishwatch" => "sl"
    # `bin/"x"`, not `"#{bin}/x"` — `brew audit --strict` rejects the
    # interpolated form, and that audit was being discarded wholesale by a
    # `|| true` in the tap CI, so nothing surfaced it.
    test: |
      system bin/"dishwatch", "--version"
      system bin/"sl", "--help"

release:
  github:
    owner: faeton
    name: dishwatch
  draft: false
  prerelease: auto
  # The Mac app is not built by goreleaser — it needs Xcode, a Developer ID and
  # two notary round-trips — so it is attached rather than produced here. Build
  # it AFTER tagging: the bundle version comes from `git describe`, so a DMG
  # built before the tag carries the previous version in its name, its
  # Info.plist and its notarization.
  # Version-exact, not a wildcard. `DishWatch-*.dmg` matched any stale image
  # left in .build — there is a 0.1.2 DMG sitting there right now — so a
  # release could silently ship the previous version's app, or ship it
  # *alongside* the right one. A missing correctly-versioned DMG now fails the
  # release instead.
  extra_files:
    - glob: app/.build/DishWatch-{{ .Version }}.dmg
